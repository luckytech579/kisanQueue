<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Slot - KisanQueue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>KisanQueue</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="queue.html">Track Token</a>
            <a href="#">About</a>
        </nav>
    </header>


    <main>

        <section class="booking-section">

            <h1>Book Your Procurement Slot</h1>

            <p>
                Select a convenient date and available time slot.
            </p>


            <div class="booking-card">

                <h2>Select Date</h2>

                <input
                    type="date"
                    id="bookingDate"
                >


                <h2>Select Time Slot</h2>


                <div class="slots">

                    <button class="slot-btn">
                        09:00 AM - 10:00 AM
                    </button>

                    <button class="slot-btn">
                        10:00 AM - 11:00 AM
                    </button>

                    <button class="slot-btn">
                        11:00 AM - 12:00 PM
                    </button>

                    <button class="slot-btn">
                        12:00 PM - 01:00 PM
                    </button>

                </div>


                <button
                    id="confirmSlot"
                    class="confirm-btn"
                >
                    Confirm Booking
                </button>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 KisanQueue</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
