<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking Confirmed - KisanQueue</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header>

        <h2>KisanQueue</h2>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="queue.html">
                Track Token
            </a>

        </nav>

    </header>


    <main>

        <section class="confirmation">

            <h1>
                🎉 Slot Confirmed
            </h1>

            <p>
                Your procurement slot has been successfully booked.
            </p>


            <div class="token-card">

                <h2>
                    Your Token
                </h2>


                <div
                    class="token-number"
                    id="tokenNumber"
                >
                    A104
                </div>


                <div
                    class="booking-details"
                >

                    <p>

                        <strong>
                            Date:
                        </strong>

                        <span id="displayDate">
                        </span>

                    </p>


                    <p>

                        <strong>
                            Time:
                        </strong>

                        <span id="displaySlot">
                        </span>

                    </p>


                    <p>

                        <strong>
                            Farmers Ahead:
                        </strong>

                        17

                    </p>


                    <p>

                        <strong>
                            Estimated Waiting:
                        </strong>

                        45 Minutes

                    </p>

                </div>


                <a href="queue.html">

                    <button>
                        Track Live Queue
                    </button>

                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 KisanQueue
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
