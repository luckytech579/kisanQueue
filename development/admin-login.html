<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - KisanQueue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h2>KisanQueue Admin</h2>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <section class="admin-login-section">

            <div class="admin-login-card">

                <h1>Admin Login</h1>

                <p>
                    Login to manage the procurement centre.
                </p>


                <form id="adminLoginForm">

                    <label for="adminUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter username"
                        required
                    >


                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="demo-login">

                    Demo Login:<br>

                    Username: admin<br>

                    Password: 1234

                </p>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 KisanQueue</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
